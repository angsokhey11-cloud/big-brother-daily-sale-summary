<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIG BROTHER — Daily Sale Summary Supabase</title>
<style>html,body{margin:0;min-height:100%;background:#f4f7fb;font-family:Arial,sans-serif}.bb-loader{min-height:100vh;display:flex;align-items:center;justify-content:center}.bb-card{background:#fff;border:1px solid #d9e2ef;border-radius:14px;padding:22px 28px;box-shadow:0 8px 30px #173a6615;color:#17457a;font-weight:800}.bb-sub{margin-top:6px;color:#6b7280;font-size:12px;font-weight:600}</style>
</head>
<body>
<div class="bb-loader"><div class="bb-card">Loading BIG BROTHER Daily Sale Summary…<div class="bb-sub">Secure Supabase invoice database</div></div></div>
<script>
(async function(){
  try{
    const response=await fetch('legacy-google-v1.html?v=20260910-1',{cache:'no-store'});
    if(!response.ok)throw new Error('Could not load Daily Sale Summary source.');
    let html=await response.text();

    const adapter='<scr'+'ipt src="supabase-daily-sales-adapter.js?v=20260910-1"></scr'+'ipt>';
    const headClose=html.toLowerCase().indexOf('</head>');
    if(headClose<0)throw new Error('Daily Sale Summary source is missing </head>.');
    html=html.slice(0,headClose)+adapter+'\n'+html.slice(headClose);

    const marker='loadInvoices(false);';
    const replacement=`// SUPABASE CUTOVER\napi = window.BBDailySalesAdapter.api;\n${marker}`;
    if(!html.includes(marker))throw new Error('Daily Sale Summary initialization marker was not found.');
    html=html.replace(marker,replacement);

    html=html.replace('<title>BIG BROTHER - Daily Sale Summary</title>','<title>BIG BROTHER — Daily Sale Summary Supabase</title>');
    html=html.replaceAll('Invoice History Source','Supabase Invoice Source');
    html=html.replaceAll('Sales Database','Supabase Sales Database');

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error(error);
    document.body.innerHTML='<div class="bb-loader"><div class="bb-card">Could not open Daily Sale Summary<div class="bb-sub">'+String(error?.message||error)+'</div></div></div>';
  }
})();
</script>
</body>
</html>
